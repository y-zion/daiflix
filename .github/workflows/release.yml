name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DAIFLIX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "DAIFLIX_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          DAIFLIX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DAIFLIX_KEYSTORE_PASSWORD: ${{ secrets.DAIFLIX_KEYSTORE_PASSWORD }}
          DAIFLIX_KEY_ALIAS: ${{ secrets.DAIFLIX_KEY_ALIAS }}
          DAIFLIX_KEY_PASSWORD: ${{ secrets.DAIFLIX_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename and checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "Daiflix-v${VERSION}.apk"
          shasum -a 256 "Daiflix-v${VERSION}.apk" > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daiflix-release
          path: |
            Daiflix-v*.apk
            SHA256SUMS.txt

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Daiflix-v*.apk
            SHA256SUMS.txt
